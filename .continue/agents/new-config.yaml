name: Main Config
version: 1.0.0
schema: v1

modelDefaults: &router
  provider: openai
  apiBase: http://localhost:20128/v1
  apiKey: dummy

models:
  # =====================================
  # PRIMARY CODING MODEL
  # =====================================
  - <<: *router
    name: Mimo V2.5 Pro
    model: sumo/mimo-v2.5-pro
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use

  # =====================================
  # REASONING / THINKING
  # =====================================
  - <<: *router
    name: GLM 5.2
    model: ZAI/glm-5.2
    roles:
      - chat
    capabilities:
      - tool_use

  # =====================================
  # AUTOCOMPLETE
  # =====================================
  - <<: *router
    name: GLM 4.5 AIR
    model: ZAI/glm-4.5-air
    roles:
      - autocomplete

    defaultCompletionOptions:
      temperature: 0.1
      maxTokens: 128

    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 4096
      onlyMyCode: true
